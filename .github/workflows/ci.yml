name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Telegram bot + HowMuch API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            howmuch_api/requirements.txt
      - run: pip install -r requirements.txt -r howmuch_api/requirements.txt pytest
      - run: python -m pytest -q

  swift:
    name: HowMuch iOS core tests
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - run: swift test
