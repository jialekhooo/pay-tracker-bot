name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Telegram bot + HowMuch API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            howmuch_api/requirements.txt
      - run: pip install -r requirements.txt -r howmuch_api/requirements.txt pytest
      - run: python -m pytest -q

  swift:
    name: HowMuch iOS core tests
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - run: swift test

  ios-app:
    name: HowMuch iOS app build
    # The app uses iOS 26 APIs, so it needs Xcode 26 or later.
    runs-on: macos-26
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      - run: xcodebuild -project HowMuch.xcodeproj -scheme HowMuch -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
