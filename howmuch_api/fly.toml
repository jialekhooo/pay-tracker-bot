app = 'howmuch-ios'
primary_region = 'sin'
[build]
  dockerfile = 'Dockerfile'
[deploy]
  strategy = 'immediate'
[env]
  HOWMUCH_DB = '/data/howmuch-ios.sqlite3'
  HOWMUCH_PUBLIC_URL = 'https://howmuch-ios.fly.dev'
  HOWMUCH_APPLE_BUNDLE_ID = 'com.jialekhoo.howmuch'
  HOWMUCH_APPLE_TEAM_ID = '8FSHKXDVJ2'
  HOWMUCH_APNS_TEAM_ID = '8FSHKXDVJ2'
[[mounts]]
  source = 'paybot_data'
  destination = '/data'
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/healthz'
[[vm]]
  size = 'shared-cpu-1x'
  memory = '2gb'
