# Staging: the same API and website on its own machine and empty database, for trying a deploy before
# production. Deploy with: flyctl deploy . --config howmuch_api/fly.staging.toml --remote-only
# It never has production data or secrets: no APNs, Gmail, Microsoft or Apple Maps keys are set here.
app = 'howmuch-ios-staging'
primary_region = 'sin'
[build]
  dockerfile = 'Dockerfile'
[deploy]
  strategy = 'immediate'
[env]
  HOWMUCH_DB = '/data/howmuch-ios.sqlite3'
  HOWMUCH_PUBLIC_URL = 'https://howmuch-ios-staging.fly.dev'
  HOWMUCH_APPLE_BUNDLE_ID = 'com.jialekhoo.howmuch'
  HOWMUCH_APPLE_TEAM_ID = '8FSHKXDVJ2'
  HOWMUCH_APNS_TEAM_ID = '8FSHKXDVJ2'
[[mounts]]
  source = 'staging_data'
  destination = '/data'
[http_service]
  internal_port = 8080
  force_https = true
  # Staging sleeps when nobody uses it, so it costs almost nothing between tests.
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/healthz'
[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
