# fly.toml app configuration file generated for pay-tracker-bot on 2026-08-21T13:04:45Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'pay-tracker-bot'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  strategy = 'immediate'

[env]
  PAYBOT_DB = '/data/paybot.sqlite3'
  PAYBOT_FEED_URL = 'https://pay-tracker-bot.fly.dev'
  PORT = '8080'

[[mounts]]
  source = 'paybot_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  checks = [{ grace_period = '20s', interval = '30s', method = 'GET', path = '/healthz', timeout = '5s' }]

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 2048
  processes = ['app']
