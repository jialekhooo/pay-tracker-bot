<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Pay tracker</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="who">
        <div class="avatar" id="avatar">P</div>
        <div class="titles">
          <h1 id="greeting">Pay tracker</h1>
          <div class="asof" id="asof">mini app</div>
        </div>
      </div>
      <button class="icon-btn" id="refresh" aria-label="Refresh" title="Refresh">⟳</button>
    </header>

    <main id="main">
      <div class="state" id="loading">
        <div class="spinner"></div>
        <p>Loading your shifts…</p>
      </div>
      <div class="state hidden" id="error">
        <p id="error-text">Open this from the Pay tracker bot in Telegram.</p>
      </div>
      <div class="hidden" id="content"></div>
    </main>

    <nav class="bottom-nav" id="bottom-nav">
      <button class="nav-btn active" data-view="overview">
        <span class="nav-icon">🏠</span><span>Overview</span>
      </button>
      <button class="nav-btn" data-view="upcoming">
        <span class="nav-icon">🗓️</span><span>Upcoming</span>
      </button>
      <button class="nav-btn" data-view="months">
        <span class="nav-icon">📊</span><span>Months</span>
      </button>
      <button class="nav-btn" data-view="events">
        <span class="nav-icon">🏷️</span><span>Events</span>
      </button>
      <button class="nav-btn" data-view="settings">
        <span class="nav-icon">⚙️</span><span>Settings</span>
      </button>
    </nav>

    <button class="fab" id="fab-add" aria-label="Add shift" title="Add shift">+</button>

    <div class="modal-backdrop hidden" id="edit-backdrop">
      <div class="modal-sheet" id="edit-sheet">
        <div class="modal-handle"></div>
        <h2 id="edit-title">Edit shift</h2>
        <form id="edit-form">
          <label>
            Event
            <input type="text" name="event" required maxlength="120" />
          </label>
          <label>
            Location
            <input type="text" name="location" maxlength="120" placeholder="optional" />
          </label>
          <div class="field-row">
            <label>
              Date
              <input type="date" name="day" required />
            </label>
          </div>
          <div class="field-row">
            <label>
              Start
              <input type="time" name="start" required />
            </label>
            <label>
              End
              <input type="time" name="end" required />
            </label>
          </div>
          <label>
            Rate / hour
            <input
              type="number"
              name="rate"
              min="0"
              step="0.01"
              inputmode="decimal"
              placeholder="uses your saved rate"
            />
          </label>
          <p class="modal-error hidden" id="edit-error"></p>
          <div class="modal-actions">
            <button type="button" class="btn secondary" id="edit-cancel">Cancel</button>
            <button type="submit" class="btn primary" id="edit-save">Save</button>
          </div>
        </form>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
