<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <!-- Opts out of Android WebView's automatic darkening, which would recolour the fixed palette. -->
  <meta name="color-scheme" content="light" />
  <title>HowMuch</title>
  <link rel="stylesheet" href="style.css?v=51" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="who">
        <div class="titles">
          <h1 id="greeting">Overview</h1>
          <div class="asof" id="asof">mini app</div>
        </div>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" id="search-open" aria-label="Search shifts" title="Search shifts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m20 20-4.35-4.35"/></svg></button>
        <button class="icon-btn" id="refresh" aria-label="Refresh" title="Refresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 0 1 13.66-5.66L20 8.5"/><path d="M20 4v4.5h-4.5"/><path d="M20 12a8 8 0 0 1-13.66 5.66L4 15.5"/><path d="M4 20v-4.5h4.5"/></svg></button>
        <button class="profile-btn hidden" id="profile-button" aria-label="Open profile settings" title="Profile settings">
          <span class="avatar" id="avatar">H</span>
        </button>
      </div>
    </header>

    <main id="main">
      <div class="state" id="loading">
        <div class="spinner"></div>
        <p>Loading your shifts…</p>
      </div>
      <div class="state hidden" id="error">
        <p id="error-text">Open this from the HowMuch bot in Telegram.</p>
      </div>
      <div class="hidden" id="content-wrap">
        <div id="content-head"></div>
        <div id="content-list"></div>
      </div>
    </main>

    <nav class="bottom-nav" id="bottom-nav">
      <button class="nav-btn active" data-view="dashboard">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 10.8 12 4l8.5 6.8"/><path d="M5.5 9.5V20h13V9.5"/><path d="M9.5 20v-6h5v6"/></svg></span><span>Overview</span>
      </button>
      <button class="nav-btn" data-view="summary">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 20V11"/><path d="M12 20V4.5"/><path d="M19.5 20v-7.5"/></svg></span><span>Earnings</span>
      </button>
      <button class="nav-btn nav-add" data-view="add" aria-label="Add Shift">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span><span>Add</span>
      </button>
      <button class="nav-btn" data-view="calendar">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 9.5h17"/><path d="M8 3.2v3.6M16 3.2v3.6"/><path d="M7.7 13.3h1.6M11.2 13.3h1.6M14.7 13.3h1.6M7.7 16.6h1.6M11.2 16.6h1.6"/></svg></span><span>Calendar</span>
      </button>
      <button class="nav-btn" data-view="settings">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 13.4a7.6 7.6 0 0 0 .07-1.4 7.6 7.6 0 0 0-.07-1.4l2-1.5-2-3.4-2.3.9a7.7 7.7 0 0 0-2.4-1.4L14.3 3H9.7l-.37 2.3a7.7 7.7 0 0 0-2.4 1.4l-2.3-.9-2 3.4 2 1.5a7.6 7.6 0 0 0 0 2.8l-2 1.5 2 3.4 2.3-.9c.72.62 1.53 1.1 2.4 1.4L9.7 21h4.6l.37-2.3c.87-.3 1.68-.78 2.4-1.4l2.3.9 2-3.4Z"/></svg></span><span>Settings</span>
      </button>
    </nav>

    <div class="toast hidden" id="toast">
      <span id="toast-text"></span>
      <button type="button" id="toast-action"></button>
    </div>

    <div class="modal-backdrop hidden" id="search-backdrop">
      <div class="modal-sheet" id="search-sheet">
        <div class="modal-handle"></div>
        <h2>Search shifts</h2>
        <input
          type="search"
          id="search-input"
          placeholder="Event or location…"
          autocomplete="off"
        />
        <div id="search-results" class="search-results"></div>
        <div class="modal-actions">
          <button type="button" class="btn secondary" id="search-close">Close</button>
        </div>
      </div>
    </div>

    <div class="modal-backdrop hidden" id="edit-backdrop">
      <div class="modal-sheet form-sheet" id="edit-sheet">
        <div class="sheet-bar">
          <button type="button" class="sheet-btn" id="edit-cancel">Cancel</button>
          <h2 id="edit-title">Edit Shift</h2>
          <button type="submit" class="sheet-btn strong" id="edit-save" form="edit-form">Save</button>
        </div>
        <form id="edit-form">
          <div class="form-section">
            <label class="form-row lead">
              <input type="text" name="event" required maxlength="120" placeholder="Event name" />
            </label>
            <label class="form-row">
              <span class="row-label">Location</span>
              <input type="text" name="location" maxlength="120" placeholder="None" />
            </label>
            <label class="form-row">
              <span class="row-label">Date</span>
              <span class="field-control">
                <input type="date" name="day" required />
                <span class="field-display">
                  <span class="field-value" data-field="day"></span>
                </span>
              </span>
            </label>
            <label class="form-row">
              <span class="row-label">Start</span>
              <span class="field-control">
                <input type="time" name="start" required />
                <span class="field-display">
                  <span class="field-value" data-field="start"></span>
                </span>
              </span>
            </label>
            <label class="form-row">
              <span class="row-label">End</span>
              <span class="field-control">
                <input type="time" name="end" required />
                <span class="field-display">
                  <span class="field-value" data-field="end"></span>
                </span>
              </span>
            </label>
            <label class="form-row">
              <span class="row-label">Rate / hour</span>
              <input
                type="number"
                name="rate"
                min="0"
                step="0.01"
                inputmode="decimal"
                placeholder="Saved rate"
              />
            </label>
            <label class="form-row">
              <span class="row-label">Break (hours)</span>
              <input type="number" name="break_hours" min="0" step="0.25" placeholder="0" />
            </label>
            <label class="form-row">
              <span class="row-label">Paid break</span>
              <select name="break_paid">
                <option value="yes" selected>Yes</option>
                <option value="no">No</option>
              </select>
            </label>
          </div>
          <p class="modal-error hidden" id="edit-error"></p>
          <div class="form-section hidden" id="edit-shift-actions">
            <button type="button" class="form-row action" id="edit-duplicate">
              Duplicate as new shift
            </button>
            <button type="button" class="form-row action destructive" id="edit-delete">
              Delete shift
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
  <script src="app.js?v=51"></script>
</body>
</html>
